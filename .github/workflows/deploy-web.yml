name: Build and Deploy Web UI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.1'
    
    - name: Build Wasm Module
      run: |
        mkdir -p dist
        GOOS=wasip1 GOARCH=wasm go build -o dist/core.wasm -ldflags="-s -w" ./wasm
    
    - name: Prepare Web Files
      run: |
        mkdir -p dist/web
        cp web/index.html dist/web/
        cp web/style.css dist/web/
        cp web/app.js dist/web/
        cp web/wasm-loader.js dist/web/
        cp dist/core.wasm dist/web/
        
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

