name: Build and Deploy Web UI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.1'
    
    - name: Build Wasm Module
      run: |
        mkdir -p dist
        GOOS=wasip1 GOARCH=wasm go build -o dist/core.wasm -ldflags="-s -w" ./wasm
    
    - name: Prepare Web Files
      run: |
        mkdir -p dist/web
        cp web/index.html dist/web/
        cp web/style.css dist/web/
        cp web/app.js dist/web/
        cp web/wasm-loader.js dist/web/
        cp dist/core.wasm dist/web/
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist/web

