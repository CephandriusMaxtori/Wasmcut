<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wasmcut - WASM Video Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 Wasmcut</h1>
            <p>WASM/WASI Video Editor</p>
        </header>

        <main>
            <!-- Start Screen -->
            <div id="startScreen" class="start-screen">
                <div class="start-screen-content">
                    <h2>Welcome to Wasmcut</h2>
                    <p>A WebAssembly video editor running entirely in your browser</p>
                    <button id="newProjectBtn" class="btn btn-primary btn-large">+ New Project</button>
                </div>
            </div>

            <!-- Editor Section (hidden until project created) -->
            <div id="editorSection" class="editor-section" style="display: none;">
                <!-- Header with project info and controls -->
                <div class="editor-header">
                    <div class="project-info">
                        <h3>Project: <span id="projectName">Untitled</span></h3>
                    </div>
                    <div class="editor-actions">
                        <button id="newProjectBtn2" class="btn btn-secondary btn-small">New Project</button>
                    </div>
                </div>

                <!-- Timeline Controls -->
                <div class="controls-panel">
                    <h2>Timeline Controls</h2>
                    <div class="button-group">
                        <button id="getStateBtn" class="btn btn-secondary">Refresh State</button>
                    </div>
                    <div class="button-group">
                        <button id="undoBtn" class="btn btn-small" disabled>↶ Undo</button>
                        <button id="redoBtn" class="btn btn-small" disabled>↷ Redo</button>
                    </div>
                </div>

                <!-- Timeline Visualization -->
                <div class="timeline-container">
                    <h2>Timeline</h2>
                    <div class="timeline-header">
                        <div class="ruler"></div>
                    </div>
                    <div class="timeline-tracks" id="timelineArea">
                        <div class="placeholder">Timeline will appear here</div>
                    </div>
                </div>

                <!-- Project State Display -->
                <div class="state-panel">
                    <h2>Project State</h2>
                    <div class="state-content" id="stateDisplay">
                        <p>No project loaded</p>
                    </div>
                </div>
            </div>

            <!-- Status Bar -->
            <div class="status-bar">
                <span id="statusText">Ready</span>
                <span id="wasmStatus" class="status-indicator">Wasm: Uninitialized</span>
            </div>
        </main>

        <footer>
            <p>M2 - Web UI Proof of Concept</p>
            <p><a href="https://github.com/CephandriusMaxtori/Wasmcut">GitHub Repository</a></p>
        </footer>
    </div>

    <script src="wasm_exec.js"></script>
    <script src="wasm-loader.js"></script>
    <script src="app.js"></script>
</body>
</html>
